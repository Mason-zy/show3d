<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>show3d — 点云与模型查看台</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cg fill='%23123a5c'%3E%3Ccircle cx='4' cy='4' r='1.8'/%3E%3Ccircle cx='10' cy='4' r='1.8'/%3E%3Ccircle cx='16' cy='4' r='1.8'/%3E%3Ccircle cx='4' cy='10' r='1.8'/%3E%3Ccircle cx='10' cy='10' r='1.8'/%3E%3Ccircle cx='16' cy='10' r='1.8'/%3E%3Ccircle cx='4' cy='16' r='1.8'/%3E%3Ccircle cx='10' cy='16' r='1.8'/%3E%3C/g%3E%3Ccircle cx='16' cy='16' r='1.8' fill='%23c63a2e'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Noto+Sans+SC:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <svg class="mark" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="4" cy="4" r="1.5" />
            <circle cx="10" cy="4" r="1.5" />
            <circle cx="16" cy="4" r="1.5" />
            <circle cx="4" cy="10" r="1.5" />
            <circle cx="10" cy="10" r="1.5" />
            <circle cx="16" cy="10" r="1.5" />
            <circle cx="4" cy="16" r="1.5" />
            <circle cx="10" cy="16" r="1.5" />
            <circle cx="16" cy="16" r="1.5" class="mark-live" />
          </svg>
          <span class="brand-name">show3d</span>
          <span class="brand-sub">点云与模型查看台</span>
        </div>

        <div class="topbar-actions">
          <button class="ghost" id="btn-formats" aria-haspopup="dialog">支持格式</button>
          <button class="ghost" id="btn-frame">居中</button>
          <button class="ghost" id="btn-shot">截图</button>
          <label class="btn-primary" for="file-input">打开文件</label>
          <input id="file-input" type="file" multiple hidden />
        </div>
      </header>

      <div class="body">
        <aside class="rail">
          <section class="specimen">
            <div class="specimen-head">
              <span class="chip" id="spec-format">待载入</span>
              <span class="specimen-size" id="spec-size"></span>
            </div>
            <h1 class="specimen-name" id="spec-name">没有载入文件</h1>
            <dl class="specimen-rows" id="spec-rows">
              <div class="row"><dt>点数</dt><dd id="spec-points">—</dd></div>
              <div class="row"><dt>面数</dt><dd id="spec-tris">—</dd></div>
              <div class="row"><dt>尺寸</dt><dd id="spec-dims">—</dd></div>
              <div class="row"><dt>载入耗时</dt><dd id="spec-time">—</dd></div>
            </dl>
          </section>

          <section class="group" id="group-color">
            <h2 class="group-title">着色</h2>
            <div class="seg" role="radiogroup" aria-label="着色方式">
              <button role="radio" class="seg-item is-on" data-color="height">高度</button>
              <button role="radio" class="seg-item" data-color="rgb">原色</button>
              <button role="radio" class="seg-item" data-color="class">分类</button>
              <button role="radio" class="seg-item" data-color="solid">单色</button>
            </div>
          </section>

          <section class="group" id="group-points">
            <h2 class="group-title">点</h2>
            <label class="slider">
              <span class="slider-label">大小</span>
              <input type="range" id="point-size" min="0.5" max="6" step="0.1" value="1.4" />
              <output class="slider-value" id="point-size-v">1.4</output>
            </label>
            <p class="group-note" id="points-note">载入点云后可调</p>
          </section>

          <section class="group" id="group-scene">
            <h2 class="group-title">场景</h2>
            <label class="switch"><input type="checkbox" id="opt-grid" checked /><span>网格地面</span></label>
            <label class="switch"><input type="checkbox" id="opt-axes" checked /><span>坐标轴</span></label>
            <label class="switch"><input type="checkbox" id="opt-spin" /><span>自动旋转</span></label>
          </section>

          <section class="group" id="group-samples">
            <h2 class="group-title">示例</h2>
            <div class="samples" id="samples"></div>
          </section>
        </aside>

        <main class="stage" id="stage">
          <canvas id="view"></canvas>

          <div class="empty" id="empty">
            <div class="empty-inner">
              <p class="empty-line">把文件拖到这里</p>
              <p class="empty-sub">GLB、OBJ、STL、PLY、PCD、LAS、LAZ、XYZ、TXT 都可以直接打开</p>
            </div>
          </div>

          <div class="scalebar" id="scalebar" aria-hidden="true">
            <div class="scalebar-rule"><i></i><i></i></div>
            <span class="scalebar-label" id="scalebar-label">1 m</span>
          </div>

          <div class="drop-veil" id="drop-veil"><span>松手打开</span></div>

          <div class="toast" id="toast" role="status" aria-live="polite"></div>
        </main>
      </div>

      <footer class="readout">
        <div class="ro-group">
          <span class="ro-k">光标</span>
          <span class="ro-v" id="ro-cursor">—</span>
        </div>
        <div class="ro-group">
          <span class="ro-k">点数</span>
          <span class="ro-v" id="ro-points">0</span>
        </div>
        <div class="ro-group">
          <span class="ro-k">面数</span>
          <span class="ro-v" id="ro-tris">0</span>
        </div>
        <div class="ro-group ro-right">
          <span class="ro-k">帧率</span>
          <span class="ro-v" id="ro-fps">—</span>
        </div>
      </footer>
    </div>

    <div class="popover" id="formats-popover" role="dialog" aria-label="支持的格式" hidden>
      <h3 class="popover-title">已支持的格式</h3>
      <ul class="format-list" id="format-list"></ul>
      <p class="popover-note">文件不会上传到任何服务器，解码全在本机浏览器完成。</p>
    </div>
  </body>
</html>
