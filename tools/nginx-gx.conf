# gx 上的 show3d 容器配置。
# Tailscale Funnel 按路径分流且不剥前缀，所以站点直接挂在 /show3d/ 下。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 少了斜杠会被当成文件，补一下
    location = /show3d {
        return 301 /show3d/;
    }

    location /show3d/ {
        try_files $uri $uri/ /show3d/index.html;

        # 入口 HTML 不缓存，避免发版后浏览器拿着旧资源哈希白屏
        location = /show3d/index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # 带哈希的静态资源可以长缓存
        location ~* \.(js|css|woff2?)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    location / {
        return 404;
    }
}
